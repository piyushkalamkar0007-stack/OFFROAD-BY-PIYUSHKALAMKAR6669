<style>

html,body{margin:0;height:100%;overflow:hidden;background:#d9c9a3;font:500 16px/1.25 "Barlow Condensed",system-ui,sans-serif;color:var(--bone)}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.p{position:fixed;background:var(--panel);border-radius:10px;padding:10px 12px}
#tach{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end}
#tach canvas{width:210px;height:210px}
#bars{display:flex;gap:6px;height:120px}
#bars div{width:16px;background:#3a342a;border-radius:4px;position:relative;overflow:hidden}
#bars i{position:absolute;left:0;right:0;bottom:0;height:0}
#bars b{position:absolute;bottom:-17px;left:3px;font-size:12px;color:var(--dim)}
#right{right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:210px}
.chip{display:inline-block;padding:2px 8px;margin:0 4px 4px 0;border:1px solid #5a5242;border-radius:6px;color:var(--dim)}
.chip.on{background:var(--amber);border-color:var(--amber);color:#1d1a16;font-weight:700}
#inc{display:flex;gap:12px;align-items:center;margin-top:6px}
#horizon{width:54px;height:54px;border-radius:50%;border:2px solid #5a5242;overflow:hidden;position:relative}
#horizon div{position:absolute;inset:-30px;background:linear-gradient(#7fa6b5 50%,#7a5a36 50%)}
#nav{display:flex;align-items:center;gap:8px;margin-top:6px}
#arrow{font-size:26px;color:var(--amber);display:inline-block;transition:transform .1s}
#top{left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));max-width:270px;font-size:15px}
#top kbd{background:#3a342a;border-radius:4px;padding:0 5px;color:var(--amber);font:inherit;font-weight:700}
#msg{left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);font-size:22px;font-weight:700;color:var(--amber);opacity:0;transition:opacity .3s;text-align:center;pointer-events:none}
#hint{position:fixed;inset:0;display:grid;place-items:center;background:rgba(20,16,10,.55);font-size:20px;text-align:center;cursor:pointer}
#hint div{background:var(--panel);padding:22px 30px;border-radius:12px;max-width:430px}
#hint h1{margin:0 0 6px;font-size:40px;color:var(--amber)}
